name: Build Meetily Debian package

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: Upstream repository to build
        required: true
        default: Zackriya-Solutions/meetily
      source_ref:
        description: Branch, tag, or commit to build
        required: true
        default: main
  push:
    branches:
      - main
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build-deb:
    name: Build .deb
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            curl \
            git \
            jq \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libclang-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            pkg-config \
            xz-utils

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.5.2 --activate

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Clone Meetily source
        env:
          SOURCE_REPO: ${{ github.event.inputs.source_repo || 'Zackriya-Solutions/meetily' }}
          SOURCE_REF: ${{ github.event.inputs.source_ref || 'main' }}
        run: |
          git clone --depth 1 --branch "$SOURCE_REF" "https://github.com/$SOURCE_REPO.git" source

      - name: Cache Rust and cargo build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: source -> target

      - name: Install frontend dependencies
        working-directory: source/frontend
        run: pnpm install --frozen-lockfile

      - name: Build llama-helper sidecar
        working-directory: source
        env:
          BINDGEN_EXTRA_CLANG_ARGS: -isystem/usr/lib/gcc/x86_64-linux-gnu/13/include
        run: |
          cargo build --release -p llama-helper
          target_triple="$(rustc -vV | awk '/host:/ {print $2}')"
          mkdir -p frontend/src-tauri/binaries
          cp target/release/llama-helper "frontend/src-tauri/binaries/llama-helper-$target_triple"

      - name: Build upstream Tauri Debian package
        working-directory: source/frontend
        env:
          BINDGEN_EXTRA_CLANG_ARGS: -isystem/usr/lib/gcc/x86_64-linux-gnu/13/include
        run: |
          set +e
          NO_STRIP=true pnpm tauri build --bundles deb --no-sign 2>&1 | tee tauri-build.log
          status="${PIPESTATUS[0]}"
          set -e

          if [ "$status" -ne 0 ]; then
            deb_count="$(find ../target/release/bundle/deb -maxdepth 1 -name 'meetily_*_amd64.deb' 2>/dev/null | wc -l)"
            if [ "$deb_count" -gt 0 ] && grep -q 'A public key has been found, but no private key' tauri-build.log; then
              echo "::warning::Tauri generated the Debian bundle, then failed updater signing. Continuing with the unsigned .deb artifact."
            else
              exit "$status"
            fi
          fi

      - name: Repack Debian package for /opt install
        id: repack
        run: |
          upstream_deb="$(find source/target/release/bundle/deb -maxdepth 1 -name 'meetily_*_amd64.deb' | sort | tail -n 1)"
          test -n "$upstream_deb"
          mkdir -p artifacts
          ./scripts/repack-meetily-deb.sh "$upstream_deb" artifacts
          package="$(find artifacts -maxdepth 1 -name 'meetily_*_amd64.deb' | sort | tail -n 1)"
          echo "package=$package" >> "$GITHUB_OUTPUT"

      - name: Upload Debian artifact
        uses: actions/upload-artifact@v4
        with:
          name: meetily-deb
          path: ${{ steps.repack.outputs.package }}
          if-no-files-found: error

      - name: Attach Debian package to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" "${{ steps.repack.outputs.package }}" --clobber
